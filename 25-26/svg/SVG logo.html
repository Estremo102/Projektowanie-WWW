<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>svg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="250" height="250">
    <circle cx="125" cy="125" r="100" fill="#FFFFFF00" stroke="#00EE00" stroke-width="5"/>
    <rect x="10" y="10" width="100" height="50" fill="#EEEE00"/>
  </svg>
  <svg width="250" height="250">
    <circle cx="70" cy="100" r="50" fill="#00FFFF80" />
    <circle cx="120" cy="100" r="50" fill="#FF00FF80" />
    <circle cx="95" cy="150" r="50" fill="#FFFF0080" />
  </svg>
  <svg width="300" height="300">
    <rect x="50" y="20" ry="20" width="200" height="200" 
    style="fill:#EE0000;stroke:#00000080;stroke-width:10;"/>
  </svg>
  <svg width="300" height="300">
    <polygon points="150,10 10,280 280,120 10,120 280,280"
    style="fill:lime;stroke:green;stroke-width:5;fill-rule: evenodd;"/>
  </svg>
  <svg width="200" height="200">
    <defs>
      <linearGradient id="gradient1">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="50%" stop-color="#89cff0" />
        <stop offset="100%" stop-color="#000080" />
      </linearGradient>
    </defs>
    <ellipse cx="100" cy="70" rx="100" ry="60" fill="url(#gradient1)"/>
    <text fill="#FFFFFF" font-size="45" x="50" y="80" font-family="sans-serif">SVG</text>
  </svg>
</body>
</html>
